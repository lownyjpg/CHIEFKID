```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHIEFKID COLLECTIVE</title>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            background: #080808;
            overflow-x: hidden;
        }


        /* =========================================================
           BACKGROUND VIDEO
        ========================================================= */

        .background-video {
            position: fixed;
            inset: -40px;

            width: calc(100% + 80px);
            height: calc(100% + 80px);

            object-fit: cover;

            /*
               DESENFOQUE DEL FONDO
               40px = desenfoque fuerte
            */
            filter: blur(40px);

            transform: scale(1.08);

            z-index: -3;
            pointer-events: none;
        }


        /* =========================================================
           BACKGROUND OVERLAY
        ========================================================= */

        .background-overlay {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.38);

            z-index: -2;
            pointer-events: none;
        }


        /* =========================================================
           CONTENEDOR PRINCIPAL
        ========================================================= */

        .site {
            width: 100%;
            min-height: 100vh;

            margin: 0;
            padding: 0;

            background: transparent;
            border: none;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 52px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            z-index: 100;

            transition:
                height 0.35s ease,
                background 0.35s ease,
                backdrop-filter 0.35s ease,
                padding 0.35s ease,
                border-color 0.35s ease;
        }


        /* =========================================================
           HEADER CUANDO SE HACE SCROLL
        ========================================================= */

        header.scrolled {

            height: 34px;

            background: rgba(255, 255, 255, 0.88);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border-bottom: 1px solid rgba(0, 0, 0, 0.12);

            padding: 0 14px;
        }


        /* =========================================================
           LOGO DEL HEADER
        ========================================================= */

        .header-logo {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .header-logo img {
            display: block;

            width: auto;
            height: 22px;

            object-fit: contain;

            transition:
                height 0.35s ease,
                filter 0.35s ease;
        }


        /* Logo más pequeño al hacer scroll */

        header.scrolled .header-logo img {
            height: 16px;
        }


        /* =========================================================
           NAV
        ========================================================= */

        nav {
            display: flex;
            align-items: center;

            gap: 28px;
        }

        nav a {
            color: #fff;

            text-decoration: none;

            font-size: 8px;
            font-weight: 900;

            text-transform: uppercase;

            line-height: 1;

            transition:
                color 0.35s ease,
                opacity 0.2s ease;
        }

        nav a:hover {
            opacity: 0.45;
        }


        /* NAV NEGRO CUANDO BAJA */

        header.scrolled nav a {
            color: #000;
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding-top: 145px;
            padding-bottom: 70px;
        }


        /* =========================================================
           LOGO PRINCIPAL
        ========================================================= */

        .logo-container {

            width: min(75vw, 700px);

            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .main-logo {

            display: block;

            width: 100%;
            height: auto;

            object-fit: contain;
        }


        /* =========================================================
           COLLECTIVE
        ========================================================= */

        .collective {

            width: 100%;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            margin-top: 8px;

            color: #fff;

            font-size: 15px;
            font-weight: 900;

            line-height: 1;

            text-transform: uppercase;
        }


        /* =========================================================
           SOUNDCLOUD
        ========================================================= */

        .soundcloud-section {

            display: flex;
            justify-content: center;

            margin-top: 10px;
            margin-bottom: 60px;
        }

        .soundcloud-player {

            width: 420px;
            height: 110px;

            background: #eeeeee;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #000;

            font-size: 13px;
            font-weight: 900;

            text-transform: uppercase;
        }


        /* =========================================================
           TITULOS DE SECCIONES
        ========================================================= */

        .section-title {

            text-align: center;

            color: #fff;

            /*
               MÁS GRANDE
               Estos NO son los textos del menú superior.
            */

            font-size: 22px;

            font-weight: 900;

            text-transform: uppercase;

            margin-bottom: 25px;

            letter-spacing: 0.5px;
        }


        /* =========================================================
           ARTISTAS
        ========================================================= */

        .artists {

            width: calc(100% - 65px);

            max-width: 920px;

            margin: 0 auto 70px;

            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 18px 18px;
        }


        .artist {

            aspect-ratio: 1 / 1;

            background: #000;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #fff;

            font-size: 14px;

            font-weight: 900;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .artist:hover {

            transform: scale(1.025);

            opacity: 0.85;
        }


        /* =========================================================
           STEMS / REMIXES
        ========================================================= */

        .stems {

            width: calc(100% - 65px);

            max-width: 920px;

            margin: 0 auto;
        }


        .remixes {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 110px;

            margin-top: 10px;
        }


        .remix {

            height: 46px;

            background: #000;

            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;

            font-weight: 900;

            text-transform: uppercase;

            cursor: pointer;

            transition: opacity 0.2s ease;
        }

        .remix:hover {

            opacity: 0.75;
        }


        /* =========================================================
           CONTACTO
        ========================================================= */

        .contact {

            width: calc(100% - 72px);

            max-width: 920px;

            margin: 75px auto 0;
        }


        .contact-title {

            color: #fff;

            font-size: 22px;

            font-weight: 900;

            text-transform: uppercase;
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {

            height: 160px;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 700px) {


            /* HEADER */

            header {

                height: 48px;

                padding: 0 10px;
            }


            header.scrolled {

                height: 32px;

                padding: 0 10px;
            }


            .header-logo img {

                height: 19px;
            }


            header.scrolled .header-logo img {

                height: 15px;
            }


            nav {

                gap: 13px;
            }


            /*
               EL MENÚ SIGUE PEQUEÑO
            */

            nav a {

                font-size: 6px;
            }


            /* HERO */

            .hero {

                padding-top: 110px;

                padding-bottom: 50px;
            }


            .logo-container {

                width: 78vw;
            }


            .collective {

                font-size: 11px;

                margin-top: 6px;
            }


            /* SOUNDCLOUD */

            .soundcloud-section {

                margin-bottom: 45px;
            }


            .soundcloud-player {

                width: 75%;

                height: 92px;

                font-size: 10px;
            }


            /* TITULOS */

            .section-title {

                font-size: 18px;

                margin-bottom: 18px;
            }


            /* ARTISTAS */

            .artists {

                width: calc(100% - 35px);

                grid-template-columns: repeat(2, 1fr);

                gap: 12px;

                margin-bottom: 55px;
            }


            .artist {

                font-size: 11px;
            }


            /* STEMS */

            .stems {

                width: calc(100% - 35px);
            }


            .remixes {

                gap: 15px;
            }


            .remix {

                height: 40px;

                font-size: 11px;
            }


            /* CONTACT */

            .contact {

                width: calc(100% - 40px);

                margin-top: 55px;
            }


            .contact-title {

                font-size: 18px;
            }
        }


        /* =========================================================
           MOBILE PEQUEÑO
        ========================================================= */

        @media (max-width: 420px) {


            nav {

                gap: 9px;
            }


            nav a {

                font-size: 5px;
            }


            .header-logo img {

                height: 17px;
            }


            header.scrolled .header-logo img {

                height: 14px;
            }


            .logo-container {

                width: 82vw;
            }


            .soundcloud-player {

                width: 65%;
            }


            .section-title {

                font-size: 17px;
            }


            .contact-title {

                font-size: 17px;
            }
        }

    </style>
</head>


<body>

    <script>

        const header = document.getElementById("mainHeader");

        window.addEventListener("scroll", function () {

            if (window.scrollY > 40) {

                header.classList.add("scrolled");

            } else {

                header.classList.remove("scrolled");
