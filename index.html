<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHIEFKID COLLECTIVE</title>

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #292929;
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
        }


        /* =========================================================
           CONTENEDOR PRINCIPAL
        ========================================================= */

        .site {
            width: calc(100% - 20px);
            max-width: 1200px;
            min-height: 100vh;
            margin: 10px auto;
            background: #fff;
            border: 1px solid #111;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {
            height: 42px;
            border-bottom: 1px solid #111;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 14px;
        }

        .header-logo {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .header-logo::before {
            content: "✦";
            font-size: 11px;
            margin-right: 9px;
        }

        nav {
            display: flex;
            gap: 28px;
        }

        nav a {
            text-decoration: none;
            color: #000;

            font-size: 7px;
            font-weight: 900;
            text-transform: uppercase;

            transition: opacity 0.2s ease;
        }

        nav a:hover {
            opacity: 0.45;
        }


        /* =========================================================
           HERO / LOGO
        ========================================================= */

        .hero {
            text-align: center;

            padding-top: 48px;
            padding-bottom: 40px;
        }

        .main-logo {
            font-size: clamp(50px, 11vw, 115px);
            line-height: 0.8;

            font-weight: 900;
            letter-spacing: -7px;

            display: inline-block;
        }

        .collective {
            display: block;

            width: fit-content;
            margin-left: auto;
            margin-right: 7%;

            margin-top: 8px;

            font-size: 12px;
            font-weight: 900;
        }


        /* =========================================================
           SOUNDCloud
        ========================================================= */

        .soundcloud-section {
            display: flex;
            justify-content: center;

            margin-top: 5px;
            margin-bottom: 32px;
        }

        .soundcloud-player {
            width: 290px;
            height: 92px;

            background: #eeeeee;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
        }


        /* =========================================================
           TITULOS DE SECCION
        ========================================================= */

        .section-title {
            text-align: center;

            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;

            margin-bottom: 15px;
        }


        /* =========================================================
           ARTISTAS
        ========================================================= */

        .artists {
            width: calc(100% - 65px);
            max-width: 920px;

            margin: 0 auto 21px;

            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 14px 16px;
        }

        .artist {
            aspect-ratio: 1 / 1;

            background: #000;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #fff;

            font-size: 10px;
            font-weight: 900;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .artist:hover {
            transform: scale(1.025);
            opacity: 0.85;
        }


        /* =========================================================
           STEMS / REMIXES
        ========================================================= */

        .stems {
            width: calc(100% - 65px);
            max-width: 920px;

            margin: 0 auto;
        }

        .remixes {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 110px;

            margin-top: 5px;
        }

        .remix {
            height: 34px;

            background: #000;
            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 10px;
            font-weight: 900;

            text-transform: uppercase;

            cursor: pointer;

            transition: opacity 0.2s ease;
        }

        .remix:hover {
            opacity: 0.75;
        }


        /* =========================================================
           CONTACTO
        ========================================================= */

        .contact {
            width: calc(100% - 72px);
            max-width: 920px;

            margin: 42px auto 0;
        }

        .contact-title {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            height: 120px;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 700px) {

            .site {
                width: calc(100% - 12px);
                margin: 6px auto;
            }

            header {
                padding: 0 10px;
            }

            nav {
                gap: 13px;
            }

            nav a {
                font-size: 6px;
            }

            .main-logo {
                letter-spacing: -4px;
            }

            .collective {
                margin-right: 8%;
                font-size: 10px;
            }

            .artists {
                width: calc(100% - 35px);

                grid-template-columns: repeat(2, 1fr);

                gap: 12px;
            }

            .stems {
                width: calc(100% - 35px);
            }

            .remixes {
                gap: 15px;
            }

            .contact {
                width: calc(100% - 40px);
            }
        }

        @media (max-width: 420px) {

            nav {
                gap: 9px;
            }

            nav a {
                font-size: 5px;
            }

            .header-logo {
                font-size: 12px;
            }

            .soundcloud-player {
                width: 65%;
            }
        }

    </style>
</head>


<body>

    <main class="site">


        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header>

            <div class="header-logo">
                CHIEFKID
            </div>

            <nav>
                <a href="#release">Release</a>
                <a href="#artists">Artists</a>
                <a href="#stems">Stems</a>
                <a href="#contact">Contact</a>
            </nav>

        </header>



        <!-- =====================================================
             HERO
        ====================================================== -->

        <section class="hero">

            <div class="main-logo">
                CHIEFKID
            </div>

            <div class="collective">
                COLLECTIVE
            </div>

        </section>



        <!-- =====================================================
             SOUNDCLOUD
        ====================================================== -->

        <section id="release" class="soundcloud-section">

            <div class="soundcloud-player">
                REPRODUCTOR SOUNDCLOUD
            </div>

        </section>



        <!-- =====================================================
             ARTISTAS
        ====================================================== -->

        <section id="artists">

            <h2 class="section-title">
                ARTISTAS
            </h2>


            <div class="artists">

                <div class="artist">ARTIST 01</div>
                <div class="artist">ARTIST 02</div>
                <div class="artist">ARTIST 03</div>
                <div class="artist">ARTIST 04</div>
                <div class="artist">ARTIST 05</div>

                <div class="artist">ARTIST 06</div>
                <div class="artist">ARTIST 07</div>
                <div class="artist">ARTIST 08</div>
                <div class="artist">ARTIST 09</div>
                <div class="artist">ARTIST 10</div>

            </div>

        </section>



        <!-- =====================================================
             STEMS / REMIXES
        ====================================================== -->

        <section id="stems" class="stems">

            <h2 class="section-title">
                STEMS REMIXES
            </h2>


            <div class="remixes">

                <div class="remix">
                    REMIX 1
                </div>

                <div class="remix">
                    REMIX 2
                </div>

            </div>

        </section>



        <!-- =====================================================
             CONTACTO
        ====================================================== -->

        <section id="contact" class="contact">

            <h2 class="contact-title">
                CONTACTO SUBMISSION
            </h2>

        </section>



        <!-- =====================================================
             FOOTER
        ====================================================== -->

        <footer></footer>


    </main>

</body>
</html>
